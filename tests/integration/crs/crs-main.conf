# Single include chain loaded identically by Apache (mod_security2) and
# Angie (libmodsecurity3). Anything that fails to parse here fails BOTH
# engine builds.

Include /opt/crs/modsecurity.conf
Include /opt/crs/crs-setup.conf

# go-ftw log marker. The harness brackets every test with requests carrying
# an X-CRS-Test header holding a UUID; this rule echoes that UUID into the
# audit log so go-ftw can locate each test's start/end boundary. CI-only,
# id outside the plugin's 9530xxx block and CRS ranges.
SecRule REQUEST_HEADERS:X-CRS-Test "@rx ^.*$" \
    "id:999999,phase:1,pass,t:none,log,auditlog,msg:'X-CRS-Test=%{MATCHED_VAR}'"

# Plugin phase-1 config (defaults / feature gates).
# Plain `Include` only: libmodsecurity3 3.0.14 does NOT understand
# IncludeOptional.
Include /opt/crs/plugins/*-config.conf

# CI: enable the plugin (it is OFF by default and enabled per-vhost in
# production) and turn ON the opt-in positive-security / path-allowlist layer
# so the deny rule 9530230 + the path allowlist are actually exercised. On a
# production deployment the operator sets these in the Vaultwarden
# server/location block; this only affects the integration image.
SecAction "id:9900010,phase:1,nolog,pass,t:none,setvar:tx.vaultwarden-plugin_enabled=1"
SecAction "id:9900011,phase:1,nolog,pass,t:none,setvar:tx.vaultwarden-plugin_positive_security=1"
# Also exercise the opt-in arg-name allowlist (9530240 form / 9530245 query).
SecAction "id:9900013,phase:1,nolog,pass,t:none,setvar:tx.vaultwarden-plugin_argname_allowlist=1"

# CI: the admin kill switch (9530250) is scoped to ONE synthetic Host rather
# than enabled globally. Enabling it for every test would deny /admin outright
# and break the tests that legitimately exercise the admin surface: 9530101
# (admin-token FP exclusion, POST /admin) and the /admin cases in 9530230 /
# 9530245. Host-scoping keeps both behaviours testable in the same image, and
# mirrors production, where the flag is set in one vhost.
SecRule REQUEST_HEADERS:Host "@streq admin-off.local" \
    "id:9900014,phase:1,nolog,pass,t:none,setvar:tx.vaultwarden-plugin_admin_disabled=1"

# CI: same Host-scoping trick to exercise the OTHER side of the
# positive-security gate. 9900011 turns the path allowlist on globally so the
# allowlist itself is testable; this turns it back OFF for one synthetic Host
# so we can assert that the CVE-driven rules (9530234/9530235/9530236) STILL
# run when only the plugin -- not positive-security -- is enabled. Before
# 2.2.1 the 9530201 strip range swallowed them and both CVE defences were
# silently inert on a default deployment.
SecRule REQUEST_HEADERS:Host "@streq possec-off.local" \
    "id:9900015,phase:1,nolog,pass,t:none,setvar:tx.vaultwarden-plugin_positive_security=0"

# CI: same Host-scoping trick to exercise the CONFIGURED basepath (9530229/
# 9530231) instead of the default wildcard-tolerant branch (9530230). Proves
# the one-fabricated-segment residual (tests/accepted-residual/.../9530230.yaml)
# is CLOSED when a basepath is set: /wp-content/images/shell.php (accepted
# under the default wildcard) must now 404 as "outside route map", while the
# real mounted route /vault/api/sync still passes.
SecRule REQUEST_HEADERS:Host "@streq basepath.local" \
    "id:9900016,phase:1,nolog,pass,t:none,setvar:'tx.vaultwarden-plugin_basepath=vault'"

# CI-only: go-ftw v2 brackets every test with boundary-marker requests to
# /status/<code>. That path is not a Vaultwarden route, so the positive-security
# path allowlist (9530230) legitimately denies it -- but the deny lands inside
# the test's start/end marker window and pollutes no_expect_ids assertions.
# Strip the plugin deny rules for the marker path only (phase:1 ctl applies to
# the later phase-2 evaluation). Production never sees /status/.
SecRule REQUEST_URI "@rx ^/status/\d+" \
    "id:9900012,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveById=9530230,\
    ctl:ruleRemoveById=9530231,\
    ctl:ruleRemoveById=9530232,\
    ctl:ruleRemoveById=9530245"

# Plugin "before" rules -> CRS core rules -> plugin "after" rules.
Include /opt/crs/plugins/*-before.conf
Include /opt/crs/rules/*.conf
Include /opt/crs/plugins/*-after.conf
