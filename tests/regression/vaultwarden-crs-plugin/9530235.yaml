---
meta:
  author: "eilander"
  description: "Vaultwarden: IP literal in the icon domain is denied (SSRF bypass, CVE-2026-47160)"
rule_id: 9530235
tests:
  # The CVE: Vaultwarden <1.36.0 blocked the STRING form of a private address
  # but its resolver accepted alternative integer encodings of the same IPv4,
  # so every form below reached the loopback/metadata target. Each encoding
  # gets its own test so a regex regression that reopens ONE form fails here.
  - test_id: 1
    desc: "Dotted-decimal loopback in the icon domain is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/127.0.0.1/icon.png
        output:
          log:
            expect_ids: [9530235]
  - test_id: 2
    desc: "Decimal-integer encoding (2130706433 == 127.0.0.1) is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/2130706433/icon.png
        output:
          log:
            expect_ids: [9530235]
  - test_id: 3
    desc: "Hex encoding (0x7f000001 == 127.0.0.1) is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/0x7f000001/icon.png
        output:
          log:
            expect_ids: [9530235]
  - test_id: 4
    desc: "Octal encoding (0177.0.0.1 == 127.0.0.1) is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/0177.0.0.1/icon.png
        output:
          log:
            expect_ids: [9530235]
  - test_id: 5
    desc: "Short-form IPv4 (127.1 == 127.0.0.1) is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/127.1/icon.png
        output:
          log:
            expect_ids: [9530235]
  - test_id: 6
    desc: "Cloud metadata address (169.254.169.254) is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/169.254.169.254/icon.png
        output:
          log:
            expect_ids: [9530235]
  - test_id: 7
    desc: "IPv6 loopback literal is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/[::1]/icon.png
        output:
          log:
            expect_ids: [9530235]
  - test_id: 8
    desc: "IPv4-mapped IPv6 (::ffff:127.0.0.1) is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/::ffff:127.0.0.1/icon.png
        output:
          log:
            expect_ids: [9530235]
  # ---- negative controls: real favicon lookups must NOT be denied ----
  # These are the FP guard. A regex that over-matches (e.g. anchoring wrong,
  # or treating any digit-containing label as numeric) breaks these.
  - test_id: 9
    desc: "A normal hostname icon lookup passes"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/example.com/icon.png
        output:
          log:
            no_expect_ids: [9530235]
  - test_id: 10
    desc: "A hostname containing digits passes (not an IP literal)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/live.com1.example.org/icon.png
        output:
          log:
            no_expect_ids: [9530235]
  - test_id: 11
    desc: "An all-numeric LABEL with a real TLD passes (123.com is a hostname)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /icons/123.com/icon.png
        output:
          log:
            no_expect_ids: [9530235]
