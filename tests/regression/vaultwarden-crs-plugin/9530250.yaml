---
# `retry_once: true` on every stage: upstream go-ftw marker/flush race
# workaround, NOT a rule weakness. Rationale + measurements: tests/README.md.
meta:
  author: "eilander"
  description: "Vaultwarden: admin panel kill switch denies /admin when enabled (RCE surface removal)"
rule_id: 9530250
tests:
  # The kill switch is OPT-IN. CI enables it for the synthetic Host
  # admin-off.local ONLY (see tests/integration/crs/crs-main.conf, 9900014),
  # so the same image can still exercise the tests that need a live /admin.
  #
  # Tests 1-4 use admin-off.local (switch ON -> deny).
  # Tests 5-7 use ci.local      (switch OFF -> the default, /admin reachable).
  # The ci.local cases are the negative control that proves the rule is
  # genuinely gated and not simply always-on.
  - test_id: 1
    desc: "With the kill switch on, GET /admin is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /admin
        output:
          retry_once: true
          log:
            expect_ids: [9530250]
  - test_id: 2
    desc: "With the kill switch on, a POST of the admin token is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /admin
          data: "token=supersecretadmintoken"
        output:
          retry_once: true
          log:
            expect_ids: [9530250]
  - test_id: 3
    desc: "With the kill switch on, admin sub-paths are denied (the RCE surface)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /admin/diagnostics
        output:
          retry_once: true
          log:
            expect_ids: [9530250]
  - test_id: 4
    desc: "With the kill switch on, a non-admin route is still reachable"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /api/sync
        output:
          retry_once: true
          log:
            no_expect_ids: [9530250]
  # ---- negative control: switch OFF is the default ----
  - test_id: 5
    desc: "With the kill switch off (default), GET /admin is NOT denied by 9530250"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /admin
        output:
          retry_once: true
          log:
            no_expect_ids: [9530250]
  - test_id: 6
    desc: "With the kill switch off, admin sub-paths are NOT denied by 9530250"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /admin/diagnostics
        output:
          retry_once: true
          log:
            no_expect_ids: [9530250]
  - test_id: 7
    desc: "With the kill switch off, the admin token POST still reaches the FP exclusion path"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /admin
          data: "token=supersecretadmintoken"
        output:
          retry_once: true
          log:
            no_expect_ids: [9530250]
  # The existing 9530250.yaml proves the on/off gate works. These pin the
  # PATH boundary of the rule: the kill switch must cover the whole admin
  # surface (any depth, any mount) without swallowing unrelated routes whose
  # names merely start with "admin". Kill-switch-ON scoping in CI is Host-
  # scoped -- see the CI note in crs-main.conf (9900014, Host admin-off.local).
  - test_id: 8
    desc: "With the kill switch on, /admin under a basepath mount is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /vault/admin
        output:
          retry_once: true
          log:
            expect_ids: [9530250]
  - test_id: 9
    desc: "With the kill switch on, a trailing-slash /admin/ is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /admin/
        output:
          retry_once: true
          log:
            expect_ids: [9530250]
  - test_id: 10
    desc: "With the kill switch on, a deep admin action path is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /admin/users/abc123/delete
        output:
          retry_once: true
          log:
            expect_ids: [9530250]
  # ---- scoping guards: near-miss names are NOT the admin panel ----
  # These must not be attributed to the kill switch. They are still denied by
  # the route allowlist (9530230) because they are not real routes -- which is
  # correct, and is exactly why the assertion here is scoped to 9530250 only.
  - test_id: 11
    desc: "/administrator is not the admin panel (denied by the route allowlist, not the kill switch)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /administrator
        output:
          retry_once: true
          log:
            no_expect_ids: [9530250]
  - test_id: 12
    desc: "/admin.php is not the admin panel (denied by the route allowlist, not the kill switch)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: admin-off.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /admin.php
        output:
          retry_once: true
          log:
            no_expect_ids: [9530250]
