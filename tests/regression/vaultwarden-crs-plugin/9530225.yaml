---
# `retry_once: true` on every stage: upstream go-ftw marker/flush race
# workaround, NOT a rule weakness. Rationale + measurements: tests/README.md.
meta:
  author: "eilander"
  description: "Vaultwarden positive-security: Content-Type enforcement on /api writes"
rule_id: 9530225
tests:
  - test_id: 1
    desc: "POST /api/ciphers with a non-JSON Content-Type is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /api/ciphers
          data: "type=1&name=x"
        output:
          retry_once: true
          log:
            expect_ids: [9530225]
  - test_id: 2
    desc: "POST /api/ciphers with application/json is allowed"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: application/json
          port: 80
          method: POST
          uri: /api/ciphers
          data: '{"type":1}'
        output:
          retry_once: true
          log:
            no_expect_ids: [9530225]
  - test_id: 3
    desc: "Multipart upload to /api/sends/file is allowed (exception)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: "multipart/form-data; boundary=xyz"
          port: 80
          method: POST
          uri: /api/sends/file/v2
          data: "--xyz--"
        output:
          retry_once: true
          log:
            no_expect_ids: [9530225]
  - test_id: 4
    desc: "A GET (no body) is not subject to the Content-Type check"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
          port: 80
          method: GET
          uri: /api/sync
        output:
          retry_once: true
          log:
            no_expect_ids: [9530225]
  # ---- FP guards: real client traffic must not be 415'd ----
  # The regex is `^application/json(?:;|$)`, so a charset parameter has to
  # pass. Every real browser/extension client sends one; if this breaks,
  # every write on the vault 415s.
  - test_id: 5
    desc: "application/json with a charset parameter is allowed"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: "application/json; charset=utf-8"
          port: 80
          method: POST
          uri: /api/ciphers
          data: '{"name":"2.aaa|bbb|ccc"}'
        output:
          retry_once: true
          log:
            no_expect_ids: [9530225]
  - test_id: 6
    desc: "A multipart attachment upload is allowed (the second documented exception)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: "multipart/form-data; boundary=xyz"
          port: 80
          method: POST
          uri: /api/ciphers/abc123/attachment/v2
          data: "--xyz--"
        output:
          retry_once: true
          log:
            no_expect_ids: [9530225]
  - test_id: 7
    desc: "The form-encoded token grant is out of scope (it is under /identity, not /api)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /identity/connect/token
          data: "grant_type=password&username=u&password=2.aaa%7Cbbb%7Cccc"
        output:
          retry_once: true
          log:
            no_expect_ids: [9530225]
  # ---- deny side ----
  - test_id: 8
    desc: "A PUT to /api with a non-JSON Content-Type is denied (not just POST)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: text/plain
          port: 80
          method: PUT
          uri: /api/ciphers/abc123
          data: "x"
        output:
          retry_once: true
          log:
            expect_ids: [9530225]
  - test_id: 9
    desc: "text/xml on an /api write is denied"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: text/xml
          port: 80
          method: POST
          uri: /api/ciphers
          data: "<a/>"
        output:
          retry_once: true
          log:
            expect_ids: [9530225]
# NOT TESTED HERE: an /api write with NO Content-Type header at all.
# Real behaviour (verified live on both engines with a hand-built request:
# apache 200, nginx 404, audit log shows 920340 + 949110 but NOT 9530225) is
# that such a write is deliberately NOT 415'd -- the last chain link is a
# negated regex against REQUEST_HEADERS:Content-Type, and an absent variable
# does not match, so the chain breaks. That is intentional: it avoids FPs on
# odd clients, and CRS has its own missing-Content-Type handling
# (issues.md, [INFO] 2026-07-26).
#
# It has no go-ftw case because the harness cannot express it: go-ftw's
# testoverride injects a default Content-Type, so a case claiming to send no
# header actually sends one and would pass for the wrong reason. Documented
# rather than faked.
  # NOTE (2.2.1, codex audit #6): the ABSENT-Content-Type fail-open fixed in
  # 2.2.1 is deliberately NOT tested here. go-ftw injects a default
  # Content-Type on every request, so a yaml case for "no CT header at all"
  # would pass for the wrong reason no matter what the rule does -- it was
  # measured passing against BOTH the fixed and the sabotaged plugin. The real
  # check needs a raw socket and lives in tests/absent-content-type-probe.sh,
  # which is sabotage-verified on both engines.
  #
  # 2.2.1 (codex audit #8): the multipart exceptions were bare prefixes, so a
  # fabricated path matched the exception and skipped CT enforcement entirely.
  - test_id: 11
    desc: "A fabricated path near the multipart exception still enforces Content-Type"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /api/sends/fileevil
          data: 'x=1'
        output:
          retry_once: true
          log:
            expect_ids: [9530225]
  - test_id: 12
    desc: "The real multipart upload route is still exempt from Content-Type enforcement"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: ci.local
            User-Agent: OWASP CRS
            Accept: "*/*"
            Content-Type: multipart/form-data; boundary=xx
          port: 80
          method: POST
          uri: /api/sends/file
          data: "--xx\r\nContent-Disposition: form-data; name=\"f\"\r\n\r\nv\r\n--xx--\r\n"
        output:
          retry_once: true
          log:
            no_expect_ids: [9530225]
