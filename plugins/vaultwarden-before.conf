# OWASP CRS Plugin
# Plugin name: vaultwarden
# Plugin description: Tailored OWASP CRS support for Vaultwarden --
#                     "before" rules (false-positive exclusions). Runs
#                     before the CRS rules so it can disable target checks.
# Rule ID block base: 9,530,000 (range is 1000, thus ID block base +1000)
# Plugin version: 2.2.3

# ------------------------------------------------------------------------
# These strip well-understood false positives in Vaultwarden's JSON API and
# admin panel. The whole block is gated by tx.vaultwarden-plugin_enabled,
# which is OFF by default and set to 1 only from the Vaultwarden vhost.
# There is no Host gate: scoping is the per-vhost enable flag, so these
# exclusions cannot weaken protection on other sites behind the same CRS.
#
# Note on payloads: the Bitwarden protocol is end-to-end encrypted. Cipher
# fields, keys, attachments and the protected symmetric key are opaque
# base64 / "2.<iv>|<ct>|<mac>" EncString blobs. To CRS these look like
# base64/SQLi/encoding anomalies, so the heaviest noise is on those bodies.
#
# Route map re-verified against Vaultwarden source at commit 169aa5e
# (src/main.rs mounts, src/api/web.rs static routes, src/api/identity.rs
# ConnectData) + the bundled web-vault static tree (vaultwarden/server:latest).
# ------------------------------------------------------------------------

# Master off-switch: when not enabled for this vhost, strip the whole
# exclusion range (9530100-9530199) for this request.
SecRule TX:vaultwarden-plugin_enabled "!@eq 1" \
    "id:9530099,phase:1,pass,nolog,ver:'vaultwarden-plugin/2.0.0',ctl:ruleRemoveById=9530100-9530199"

# ------------------------------------------------------------------------
# [ Argument-name allowlist -- EXPERIMENTAL, opt-in via
#   tx.vaultwarden-plugin_argname_allowlist=1 ]
#
# These live in the BEFORE file on purpose: their deny must evaluate ahead of
# the CRS anomaly-blocking rule (949110, end of the core rules). If they were
# in the AFTER file, a request CRS already scored >=5 would be blocked by
# 949110 first and the allowlist deny would never be reached.
#
# Vaultwarden is a JSON API and its JSON body keys vary per endpoint, client
# and version -- so JSON bodies are NEVER arg-name-checked. Only the two
# stable, fully-enumerated NON-JSON surfaces are covered:
#   9530240 -- /identity/connect/token form fields (the ONLY
#              x-www-form-urlencoded endpoint; field set fixed by the
#              ConnectData struct in src/api/identity.rs, verified against
#              source; case-insensitive, snake_case + flattened variants).
#              ARGS_POST_NAMES scoped to that exact path, so JSON bodies on
#              other endpoints are untouched.
#   9530245 -- GET query-string parameter names (ARGS_GET_NAMES).
# Default OFF (gated by 9530202). Run DetectionOnly first.
# ------------------------------------------------------------------------

# Gate: strip the arg-name allowlist (9530240-9530249) unless its own flag is
# on. Independent of positive-security so the two enable separately.
#
# 2.2.1: ALSO strip it when the master enable flag is off. The master
# off-switch (9530099) only covers the 9530100-9530199 exclusion range, and
# the after-file's 9530200 gate covers 9530201-9530399 -- neither reaches
# 9530240-9530249, which lives in THIS file and evaluates before both. So a
# vhost with plugin_enabled=0 but a leftover argname_allowlist=1 still had
# 9530240/9530245 denying traffic for a plugin that is supposed to be off.
SecRule TX:vaultwarden-plugin_enabled "!@eq 1" \
    "id:9530204,phase:1,pass,nolog,ver:'vaultwarden-plugin/2.2.1',ctl:ruleRemoveById=9530240-9530249"

SecRule TX:vaultwarden-plugin_argname_allowlist "!@eq 1" \
    "id:9530202,phase:1,pass,nolog,ver:'vaultwarden-plugin/2.0.0',ctl:ruleRemoveById=9530240-9530249"

# Form-field allowlist on the token endpoint (phase 2 -- request body parsed).
# Field set = ConnectData (src/api/identity.rs): grant_type, refresh_token,
# client_id, client_secret, password, password_hash_b64, scope, username,
# device_identifier/name/type/push_token, two_factor_provider/token/remember,
# authrequest, code, code_verifier, send_id. Each has a snake_case and a
# flattened (no-underscore) #[field] alias, matched via `_?`.
SecRule REQUEST_FILENAME "@rx ^/?(?:[a-z0-9_-]+/)?identity/connect/token$" \
    "id:9530240,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,t:normalizePath,\
    msg:'Vaultwarden positive-security: disallowed form field on token endpoint',\
    logdata:'unexpected form field: %{MATCHED_VAR_NAME}',\
    ver:'vaultwarden-plugin/2.0.0',\
    tag:'application-multi',\
    tag:'vaultwarden',\
    chain"
    SecRule ARGS_POST_NAMES "!@rx ^(?:grant_?type|refresh_?token|client_?id|client_?secret|password|password_?hash_?b64|scope|username|device_?identifier|device_?name|device_?type|device_?push_?token|two_?factor_?provider|two_?factor_?token|two_?factor_?remember|auth_?request|code|code_?verifier|send_?id)$" \
        "t:none,t:lowercase,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# GET query-string parameter-name allowlist (phase 1).
#   access_token -- /notifications/hub + /notifications/anonymous-hub SignalR
#                   WebSocket negotiate carries the JWT as a query arg.
#   token        -- /attachments/<cipher>/<file>?token=<JWT> download grant.
#   uri          -- /icons/change-password-uri well-known icon lookup.
#   code / state / error / error_description -- SSO/OIDC callback query args.
#   auth_request_id -- passwordless auth-request polling.
#   cache        -- web-vault i18n loader cache-buster on
#                   /locales/<lang>/messages.json (?cache=<hash>).
# Arg-NAME allowlist only -- the value is still inspected by every CRS rule.
SecRule ARGS_GET_NAMES "!@rx ^(?:excludedomains|count|t|negotiateversion|username|domain|id|type|continuationtoken|autofilltype|isotptype|start|end|deviceidentifier|hibp|access_token|token|uri|code|code_verifier|state|error|error_description|auth_request_id|cache)$" \
    "id:9530245,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,\
    msg:'Vaultwarden positive-security: disallowed query parameter name',\
    logdata:'unexpected query arg: %{MATCHED_VAR_NAME}',\
    ver:'vaultwarden-plugin/2.0.0',\
    tag:'application-multi',\
    tag:'vaultwarden',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    severity:'CRITICAL'"

# ------------------------------------------------------------------------
# [ Admin panel login ]  /admin -- the ADMIN_TOKEN is a long Argon2/PHC
# string ($argon2id$v=19$...) or opaque token that trips SQLi/encoding
# heuristics; the form posts it as `token`.
# ------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/?(?:[a-z0-9_-]+/)?admin(?:/.*)?$" \
    "id:9530101,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-plugin/2.0.0',\
    tag:'OWASP_CRS',\
    tag:'vaultwarden',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:token"

# ------------------------------------------------------------------------
# [ OAuth token endpoint ]  /identity/connect/token -- the only routinely
# x-www-form-urlencoded body. Carries the master-password hash, refresh
# tokens, device identifiers and 2FA blobs: all high-entropy opaque values.
# ------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/?(?:[a-z0-9_-]+/)?identity/connect/token$" \
    "id:9530102,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-plugin/2.0.0',\
    tag:'OWASP_CRS',\
    tag:'vaultwarden',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password_hash_b64,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:refresh_token,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:deviceidentifier,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:devicepushtoken,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:authrequest,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:twofactortoken,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:code_verifier"

# ------------------------------------------------------------------------
# [ JSON API bodies ]  The bulk of the API is application/json. ModSecurity
# only parses JSON arg values when the JSON body processor is on (CRS sets
# it via Content-Type). Vaultwarden cipher/account/key endpoints carry
# EncString + base64 blobs that read as base64/SQLi/PHP anomalies. Strip the
# noisiest base64/SQLi/PHP-injection rule families on these write paths
# rather than weakening the whole engine.
# Paths verified against source (src/api/core/{accounts,ciphers,sends}.rs,
# organizations.rs):
#   /api/accounts/...   register, password, key, kdf, security-stamp
#   /api/ciphers...     create/update + import + import-organization
#   /api/sends...       Bitwarden Send (file/text, opaque)
#   /api/organizations/<id>/users/...  invite/confirm (carry public keys)
#
# 2.2.2: the path regex is now END-BOUNDED with `(?:/.*)?$`. It used to be a
# bare prefix, so a fabricated suffix -- /api/ciphersEVIL, /api/accounts-evil/x,
# /api/sendsEVIL -- also matched and stripped 284 CRS rules (263 platform-multi
# + 21 attack-injection-php, spanning SQLi/XSS/Java/RCE/web-shells) on a path
# Vaultwarden does not route. Measured on both engines: a
# `<?php system($_GET[c]); ?>` query value fires 933100/933130/933160/949110 on
# /api/ciphersEVIL and NONE of them on the real /api/ciphers/import, which is
# exactly the exemption scope this rule is supposed to have. (The regression
# test uses a query-string payload, not a JSON body: this CRS build ships
# ctl:requestBodyProcessor=JSON commented out, so a JSON body never reaches
# ARGS and 933160 could not match it.) The path allowlist does NOT compensate --
# 9530230 allows `api` as a mount and its `(?:/.*)?$` swallows the fabricated
# suffix, so 9530230 never fires on these. Same class as the 9530105 fix in
# 2.2.1; this is its sibling, missed in that pass. Real subpaths
# (/api/ciphers/import, /api/organizations/<id>/users/invite) still match.
# ------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/?(?:[a-z0-9_-]+/)?api/(?:accounts|ciphers|sends|organizations/[^/]+/users)(?:/.*)?$" \
    "id:9530103,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-plugin/2.2.2',\
    tag:'OWASP_CRS',\
    tag:'vaultwarden',\
    ctl:ruleRemoveByTag=attack-injection-php,\
    ctl:ruleRemoveByTag=platform-multi,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942260,\
    ctl:ruleRemoveById=942330,\
    ctl:ruleRemoveById=942340,\
    ctl:ruleRemoveById=942370,\
    ctl:ruleRemoveById=942430,\
    ctl:ruleRemoveById=942440"

# ------------------------------------------------------------------------
# [ Icon fetch ]  /icons/<domain>/icon.png -- <domain> is a user-supplied
# hostname that can resemble path-traversal/SSRF heuristics to CRS but is
# validated by Vaultwarden itself.
# ------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/?(?:[a-z0-9_-]+/)?icons/" \
    "id:9530104,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-plugin/2.0.0',\
    tag:'OWASP_CRS',\
    tag:'vaultwarden',\
    ctl:ruleRemoveByTag=attack-lfi,\
    ctl:ruleRemoveByTag=attack-rfi"

# ------------------------------------------------------------------------
# [ Auth endpoints ]  /identity/connect/token and
# /identity/accounts/prelogin/* carry only opaque, high-entropy values: the
# master-password hash / KDF output, EncString-style `2.<iv>|<ct>|<mac>`
# blobs, base64 device tokens and refresh tokens. The `|`, `==`, `.` and
# base64 in these values trip the CRS SQLi/encoding/protocol heuristics and
# push the inbound anomaly score to the blocking threshold -> intermittent
# 949110 FP on REAL logins (confirmed in production: a Firefox web-vault POST
# to /identity/connect/token with a normal EncString password value scored 5
# and was 302'd to the block page).
#
# Per-target exclusions (9530102) and per-family tag strips are NOT enough --
# the contributor rotates across families depending on which char in the
# ciphertext trips first. These endpoints are pure authentication: no SQL, no
# HTML, no shell, no path, no JSON business logic behind them -- the entire
# CRS request-attack scan is noise here. So strip ALL CRS rules for these two
# paths. This is safe because the surface is still protected by:
#   - the form-field arg-name allowlist (9530240, only known OAuth fields),
#   - the path + method allowlist (9530230 / 9530220), and
#   - the edge rate limit on the auth zone (contrib vhost) -- brute force is a
#     rate problem, not a payload problem.
#
# 2.2.1: the path regex is now END-ANCHORED. It used to be a bare prefix, so
# a fabricated suffix -- /identity/connect/token.evil, /identity/accounts/
# preloginXXX -- also stripped the ENTIRE CRS rule set, while the compensating
# form-field allowlist (9530240) is anchored `token$` and did NOT cover the
# fabricated path. That asymmetry left a payload-inspection-free route to the
# backend. `token` is an exact route so it anchors hard; `prelogin` keeps an
# explicit `(?:/.*)?` subpath because the real route is /prelogin/<kdf-type>
# (regression test 9530105-2) -- the point is the BOUNDARY after the route
# token, not forbidding subpaths.
#
# NOTE: `ruleRemoveByTag=OWASP_CRS` here strips only CRS core rules (all
# tagged OWASP_CRS). The plugin's OWN enforcement rules (9530220 method,
# 9530225 Content-Type, 9530230 path) are deliberately NOT tagged OWASP_CRS
# (fixed in 2.0.0), so this strip can no longer disable the positive-security
# layer on the auth paths -- previously a self-inflicted hole.
# ------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/?(?:[a-z0-9_-]+/)?identity/(?:connect/token|accounts/prelogin(?:/.*)?)$" \
    "id:9530105,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-plugin/2.0.0',\
    tag:'OWASP_CRS',\
    tag:'vaultwarden',\
    ctl:ruleRemoveByTag=OWASP_CRS"
