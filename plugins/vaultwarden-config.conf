# OWASP CRS Plugin
# Plugin name: vaultwarden
# Plugin description: Tailored OWASP CRS support for Vaultwarden
#                     (https://github.com/dani-garcia/vaultwarden), the
#                     Rust Bitwarden-compatible server. Provides
#                     false-positive exclusions for the JSON API + admin
#                     panel AND an optional positive-security (PATH
#                     allowlist) layer that denies any request outside
#                     Vaultwarden's known route map.
# Rule ID block base: 9,530,000 (range is 1000, thus ID block base +1000)
# Plugin version: 2.2.0

# ------------------------------------------------------------------------
#  WHY THIS DIFFERS FROM A FORM-APP PLUGIN
# ------------------------------------------------------------------------
#  Vaultwarden is a JSON API: clients (web-vault, browser extensions,
#  mobile, desktop, the Bitwarden CLI) POST application/json bodies, plus a
#  few x-www-form-urlencoded calls on /identity/connect/token. Their
#  argument NAMES are JSON keys that vary per endpoint and per client
#  version, so a vimbadmin-style ARGS_NAMES allowlist would false-block real
#  traffic. This plugin therefore does NOT ship an arg-name allowlist. Its
#  positive-security layer is a PATH allowlist only (block any URL outside
#  Vaultwarden's mount points + the web-vault static tree). Value scanning
#  (SQLi/XSS heuristics) still runs on whatever CRS parses; the before.conf
#  exclusions only strip the targets that are known-noisy ciphertext blobs.
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------
#  HOW TO USE
# ------------------------------------------------------------------------
#  1. Copy the three plugins/vaultwarden-*.conf files into your CRS plugins/
#     directory (loaded automatically by crs-setup).
#
#  2. Scope: OFF by default, enabled PER VHOST. In the Vaultwarden
#     server/location block set tx.vaultwarden-plugin_enabled=1 via a phase:1
#     SecAction. The rules never touch other vhosts sharing the CRS engine
#     because the flag is only set in that one block. NOTE: the vault vhost
#     must NOT have `modsecurity off;` for any of this to run.
#
#  3. The path-allowlist layer (vaultwarden-after.conf) is OFF by default and
#     must be opted into separately:
#       setvar:tx.vaultwarden-plugin_positive_security=1
#     Enabling the plugin alone gives you the false-positive exclusions only.
#     Test the allowlist in DetectionOnly first -- it denies by default, so a
#     route the map does not know about is answered 404.
#     (Changed in 2.2.0: it used to follow the enable flag automatically.)
# ------------------------------------------------------------------------

# Generic enable seeder. OFF unless a vhost opts in (a vhost setvar=1 wins).
SecRule &TX:vaultwarden-plugin_enabled "@eq 0" \
    "id:9530010,\
    phase:1,\
    pass,\
    nolog,\
    ver:'vaultwarden-plugin/2.0.0',\
    setvar:'tx.vaultwarden-plugin_enabled=0'"

# Positive-security sub-feature (PATH allowlist, 9530230): default OFF -- does
# NOT follow the enable flag. Consistent with the other two sub-features below
# (argname_allowlist, admin_disabled): enabling the plugin gets you the
# false-positive exclusions, which are safe on any Vaultwarden deployment;
# turning a deny-by-default route allowlist on is a separate, conscious choice.
#
# 2.2.0 CHANGE (breaking): this previously defaulted to
# %{tx.vaultwarden-plugin_enabled}, so the allowlist switched on automatically
# with the plugin. Deployments that relied on that MUST now set the flag
# explicitly or the allowlist silently stops running.
#
# The allowlist is the layer most likely to 404 a legitimate route if your
# deployment differs from the verified route map (custom basepath, reverse
# proxy rewriting, a web-vault version shipping new static dirs). Run it in
# DetectionOnly first.
#
# Turn on per vhost:  setvar:tx.vaultwarden-plugin_positive_security=1
SecRule &TX:vaultwarden-plugin_positive_security "@eq 0" \
    "id:9530012,\
    phase:1,\
    pass,\
    nolog,\
    ver:'vaultwarden-plugin/2.2.0',\
    setvar:'tx.vaultwarden-plugin_positive_security=0'"

# Argument-name allowlist sub-feature (EXPERIMENTAL, default OFF -- does NOT
# follow the enable flag). Vaultwarden is a JSON API whose body keys vary per
# endpoint/client/version, so a body allowlist is unsafe; this feature ONLY
# allowlists the two stable, fully-enumerated non-JSON surfaces:
#   - the /identity/connect/token form fields (fixed OAuth field set), and
#   - GET query-string parameter names.
# JSON request bodies are never arg-name-checked. Turn on per vhost ONLY after
# a DetectionOnly burn-in:
#   setvar:tx.vaultwarden-plugin_argname_allowlist=1
SecRule &TX:vaultwarden-plugin_argname_allowlist "@eq 0" \
    "id:9530014,\
    phase:1,\
    pass,\
    nolog,\
    ver:'vaultwarden-plugin/2.0.0',\
    setvar:'tx.vaultwarden-plugin_argname_allowlist=0'"

# Admin-panel kill switch (default OFF -- does NOT follow the enable flag,
# because /admin is a legitimate route and denying it must be a conscious
# choice). When set to 1, every /admin path is denied outright.
#
# WHY: the admin panel is the single highest-value surface on a Vaultwarden
# host. Two High-severity RCEs (CVE-2025-24364 and GHSA-h6cc-rc6q-23j4) are
# reachable ONLY through it -- both require admin authentication, so removing
# the surface removes the bug class rather than pattern-matching the payload.
# Most self-hosted deployments never use /admin after first-run setup (users
# are invited via SMTP, settings live in env vars), so this is free hardening.
# Vaultwarden itself disables the panel when ADMIN_TOKEN is unset; this is the
# edge-side equivalent for defence in depth, and it also covers the window
# where the token IS set but the panel is not actively in use.
#
# Turn on per vhost:  setvar:tx.vaultwarden-plugin_admin_disabled=1
SecRule &TX:vaultwarden-plugin_admin_disabled "@eq 0" \
    "id:9530016,\
    phase:1,\
    pass,\
    nolog,\
    ver:'vaultwarden-plugin/2.1.0',\
    setvar:'tx.vaultwarden-plugin_admin_disabled=0'"
